<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5월 25일 호우 대응 보도자료 모음</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1d2330;--sub:#5d6678;--line:#dfe3ea;--accent:#1f5fbf;--warn:#fdecea;--warn-t:#b3261e;--hl:#fff1a8}
@media (prefers-color-scheme:dark){:root{--bg:#14171d;--card:#1d222b;--text:#e8ebf1;--sub:#9aa4b6;--line:#2e3542;--accent:#6ea3ff;--warn:#3a1f1d;--warn-t:#ff9b93;--hl:#5a4d10}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.6}
header,main{max-width:960px;margin:0 auto;padding:0 20px}
header{padding-top:32px}
h1{font-size:1.6rem;margin:0 0 4px}
.lead{color:var(--sub);margin:0 0 20px}
h2{font-size:1.15rem;margin:32px 0 12px}
.search{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.search input{flex:1;min-width:220px;padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font-size:1rem}
.count{color:var(--sub);font-size:.95rem;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-top:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:8px}
.badge{align-self:flex-start;background:var(--accent);color:#fff;font-size:.8rem;padding:2px 10px;border-radius:999px}
.card h3{margin:0;font-size:1.05rem}
.card p{margin:0;color:var(--sub);font-size:.95rem}
.card button{align-self:flex-start;margin-top:auto;background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-size:.9rem}
.full{display:none;border-top:1px solid var(--line);padding-top:8px;font-size:.92rem;color:var(--text)}
.full.open{display:block}
mark{background:var(--hl);color:inherit;border-radius:2px}
.empty{color:var(--sub);padding:24px 0}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;background:var(--card);border:1px solid var(--line)}
th,td{padding:10px 14px;border:1px solid var(--line);text-align:center}
th{background:var(--bg)}
td.diff{background:var(--warn);color:var(--warn-t);font-weight:700}
.note{color:var(--sub);font-size:.88rem;margin-top:8px}
iframe{width:100%;height:340px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
footer{max-width:960px;margin:32px auto;padding:0 20px;color:var(--sub);font-size:.85rem}
</style>
</head>
<body>
<header>
  <h1>5월 25일 호우 대응 보도자료</h1>
  <p class="lead">행정안전부·기상청·경찰청 3개 부처의 보도자료를 모아 비교합니다.</p>
</header>
<main>
  <section>
    <div class="search">
      <input id="q" type="search" placeholder="부처명 또는 본문 키워드 검색 (예: 기상청, 인명피해)" aria-label="검색">
      <span class="count" id="count" aria-live="polite"></span>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <section>
    <h2>부처별 정합성 매트릭스</h2>
    <div id="sheetArea"></div>
  </section>
</main>
<footer>데이터: data/press.json · 매트릭스: Google Sheets 임베드</footer>

<script type="application/json" id="fallback">[
  {
    "번호": "1",
    "부처": "행정안전부",
    "제목": "5월 25일 전국 호우 대응 — 중대본 1단계 가동",
    "본문": "# 5월 25일 전국 호우 대응 — 중대본 1단계 가동\n\n행정안전부(장관 윤호중)는 5월 25일 16:30 부로 중앙재난안전대책본부 1단계를 가동하고 전국 17개 광역지방정부를 대상으로 호우 대비 비상대응 체계를 확립했다.\n\n이번 대응에는 전국적으로 **1,820명**의 공무원·소방·경찰 인력이 동원됐다. 총 투입 예산은 **23억원**으로, 자연재난 대응을 위한 예비비에서 즉시 집행된다.\n\n중앙재난안전대책본부장은 16:30 가동 명령과 함께 17개 광역지방정부에 일제히 현장 점검 지시를 내렸다. 현재까지 잠정 집계된 인명피해는 **2명**으로, 경상자 위주로 경미한 수준이다.\n\n담당 부서: 자연재난대응과 (044-205-5230)\n\n\n---"
  },
  {
    "번호": "2",
    "부처": "기상청",
    "제목": "5월 25일 전국 호우특보 발효 및 대응 동향",
    "본문": "# 5월 25일 전국 호우특보 발효 및 대응 동향\n\n기상청은 5월 25일 11:00부터 전국 17개 광역에 호우주의보를 단계적으로 발효했으며, 행정안전부와 협업해 **16:40** 부로 중앙재난안전대책본부 1단계 가동을 지원했다.\n\n기상청 IT인프라과는 재난문자 발송 자동화 시스템을 통해 행안부와 연계 대응을 진행했다. 본 대응에 동원된 인력은 행정안전부 집계 기준 **1,820명**이며, 행안부·기상청 합동 예산은 **25억원**이 집행됐다.\n\n전국 17개 광역지방정부에 호우주의보가 발효된 가운데, 잠정 인명피해는 **3명**이다.\n\n담당 부서: 기상청 IT인프라과 (02-2181-0700)\n\n\n---"
  },
  {
    "번호": "3",
    "부처": "경찰청",
    "제목": "5월 25일 호우 대응 — 교통통제 현황",
    "본문": "# 5월 25일 호우 대응 — 교통통제 현황\n\n경찰청은 5월 25일 **16:30** 부로 가동된 행정안전부 중대본 1단계에 따라 전국 주요 도로 통제 체계를 가동했다. 통제 범위는 **16개** 광역을 대상으로 했다.\n\n전국 동원 경찰 인력은 **1,800명**이며, 경찰청 자체 예산 **23억원**을 비상 운영비에 즉시 투입했다.\n\n집계된 인명피해는 **3명**으로, 경찰청 119 합동 대응체계가 신속하게 가동된 결과다.\n\n담당 부서: 경찰청 교통안전관리과 (02-3150-2300)"
  }
]</script>
<script>
/* ▼ Google Sheets "웹에 게시 → 임베드" 코드의 iframe src 주소를 여기에 붙여넣으세요.
   예: https://docs.google.com/spreadsheets/d/e/2PACX-.../pubhtml?widget=true&headers=false */
const SHEET_EMBED_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQKrc3XGwk3DETdHzmYxJXTUX8tczP_hdBqZoRCF2265B1LgSVEh19TwVdxgwGpSOHrfkkUP-oyISQ6/pubhtml";

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let items = [];

function summarize(body){
  const paras = body.split(/\n+/).map(t=>t.trim()).filter(t=>t && !t.startsWith('#') && t!=='---' && !t.startsWith('담당 부서'));
  const t = (paras[0]||'').replace(/\*\*/g,'');
  return t.length>90 ? t.slice(0,90)+'…' : t;
}
function renderBody(body){
  return body.split(/\n+/).map(t=>t.trim()).filter(t=>t && t!=='---' && !t.startsWith('#'))
    .map(t=>'<p>'+esc(t).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')+'</p>').join('');
}
function hl(text,q){
  const e = esc(text);
  if(!q) return e;
  const re = new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/[&<>"']/g,'')+')','gi');
  return e.replace(re,'<mark>$1</mark>');
}
function render(){
  const q = $('#q').value.trim();
  const ql = q.toLowerCase();
  const list = items.filter(i => !ql || i.부처.toLowerCase().includes(ql) || i.본문.toLowerCase().includes(ql));
  $('#count').textContent = '결과 '+list.length+'건';
  $('#grid').innerHTML = list.length ? list.map(i=>`
    <article class="card">
      <span class="badge">${hl(i.부처,q)}</span>
      <h3>${esc(i.제목)}</h3>
      <p>${hl(summarize(i.본문),q)}</p>
      <button type="button" data-id="${esc(i.번호)}">전문 보기</button>
      <div class="full" id="full-${esc(i.번호)}">${renderBody(i.본문)}</div>
    </article>`).join('') : '<div class="empty">검색 결과가 없습니다.</div>';
}
$('#grid').addEventListener('click',e=>{
  const b = e.target.closest('button[data-id]'); if(!b) return;
  const f = $('#full-'+b.dataset.id); const open = f.classList.toggle('open');
  b.textContent = open ? '접기' : '전문 보기';
});
$('#q').addEventListener('input',render);

/* 정합성 매트릭스 (Sheets 미설정 시 대체 표시) */
const MATRIX = {
  cols:['행정안전부','기상청','경찰청'],
  rows:[['동원인원','1,820명','1,820명','1,800명'],['투입예산','23억원','25억원','23억원'],['발령시각','16:30','16:40','16:30'],['관할지역수','17개','17개','16개'],['인명피해','2명','3명','3명']]
};
function renderSheet(){
  const area = $('#sheetArea');
  if(SHEET_EMBED_URL){
    area.innerHTML = '<iframe loading="lazy" title="부처별 정합성 매트릭스 (Google Sheets)" src="'+esc(SHEET_EMBED_URL)+'"></iframe><p class="note">Google Sheets에서 게시된 표입니다.</p>';
    return;
  }
  const body = MATRIX.rows.map(r=>{
    const vals=r.slice(1), freq={}; vals.forEach(v=>freq[v]=(freq[v]||0)+1);
    const major = Object.keys(freq).sort((a,b)=>freq[b]-freq[a])[0];
    return '<tr><th>'+r[0]+'</th>'+vals.map(v=>'<td'+(v!==major?' class="diff"':'')+'>'+v+'</td>').join('')+'</tr>';
  }).join('');
  area.innerHTML = '<p class="note">Google Sheets 임베드 주소(SHEET_EMBED_URL)가 아직 설정되지 않아 내장 표를 대신 표시합니다. 빨간 칸은 다수값과 다른 보고값입니다.</p>'
   + '<div class="tablewrap"><table><thead><tr><th>사실</th>'+MATRIX.cols.map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>'+body+'</tbody></table></div>';
}

async function init(){
  try{
    const r = await fetch('data/press.json',{cache:'no-store'});
    if(!r.ok) throw new Error(r.status);
    items = await r.json();
  }catch(e){
    items = JSON.parse($('#fallback').textContent);
  }
  render(); renderSheet();
}
init();
</script>
</body>
</html>
